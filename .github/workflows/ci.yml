name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Type Check / Lint / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Content lint check
        run: pnpm exec tsx --test tests/*.test.ts tests/*.test.tsx

      - name: Build production defaults
        run: |
          node scripts/create-test-db.mjs
          pnpm build
        env:
          DOLBOM_LOCAL_DRAFT_DB: ci.db
          TURSO_DATABASE_URL: file:./.tmp/ci.db
          TURSO_AUTH_TOKEN: ''
          NEXT_PUBLIC_LOCAL_PREVIEW: '0'
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_GA_ID: ''
          BIZINFO_API_KEY: ''
          SLACK_WEBHOOK_URL: ''
          INDEXNOW_KEY: ''
